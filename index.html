<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 首帧：不依赖外链字体与 JS，避免阻塞渲染；tokens.css 中已有系统字体栈 -->
    <style>
      html, body { min-height: 100vh; margin: 0; }
      body { background: #f1f5f9; }
      #root { min-height: 100vh; background: #fafbfd; }
      @keyframes rdk-boot-spin { to { transform: rotate(360deg); } }
      /* 置于 #root 之外，避免 React createRoot 首帧清空子节点时整页闪白；首帧后由 App 移除 */
      #rdk-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fafbfd;
        color: #64748b;
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Yu Gothic UI', 'Malgun Gothic', 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif;
      }
      #rdk-boot-splash .rdk-boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #ff6b00;
        border-radius: 50%;
        animation: rdk-boot-spin 0.75s linear infinite;
      }
      #rdk-boot-splash .rdk-boot-title {
        font-size: 14px;
        font-weight: 600;
        color: #0f172a;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RDK Studio</title>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 与 #root 同级：不被 React 替换；JS 就绪后由 App 移除 -->
    <div id="rdk-boot-splash" aria-busy="true" aria-live="polite">
      <div class="rdk-boot-spinner" aria-hidden="true"></div>
      <span class="rdk-boot-title">RDK Studio</span>
    </div>
  </body>
  </html>
