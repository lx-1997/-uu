<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data: blob:; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline';" />
  <title>RDK Studio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100%;
      height: 100%;
      -webkit-user-select: none;
      user-select: none;
    }
    .stage {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .stage:active {
      cursor: grabbing;
    }
    body.is-compact .stage {
      justify-content: center;
    }

    .welcome-cluster {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 4px;
      max-width: 100%;
      transition: opacity 0.38s ease, transform 0.38s ease;
    }
    .welcome-cluster.is-hidden {
      opacity: 0;
      transform: translateY(6px);
      /* 勿设 pointer-events: none：否则点击会穿透到透明 stage，在 Windows 上易丢命中 */
    }
    body.is-compact .welcome-cluster {
      display: none;
    }

    .bubble {
      position: relative;
      padding: 8px 12px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow:
        0 4px 24px rgba(15, 23, 42, 0.12),
        0 0 0 1px rgba(15, 23, 42, 0.06);
      animation: bubble-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 7px solid rgba(255, 255, 255, 0.94);
      filter: drop-shadow(0 2px 2px rgba(15, 23, 42, 0.06));
    }
    @keyframes bubble-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bubble-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bubble-text {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #0f172a;
      white-space: nowrap;
    }

    /* 声波条：模拟「在说话」 */
    .wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }
    .wave span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: linear-gradient(180deg, #6366f1, #8b5cf6);
      animation: wave-bar 0.55s ease-in-out infinite alternate;
    }
    .wave span:nth-child(1) { height: 6px; animation-delay: 0ms; }
    .wave span:nth-child(2) { height: 12px; animation-delay: 0.1s; }
    .wave span:nth-child(3) { height: 16px; animation-delay: 0.05s; }
    .wave span:nth-child(4) { height: 8px; animation-delay: 0.15s; }
    @keyframes wave-bar {
      from {
        transform: scaleY(0.35);
        opacity: 0.65;
      }
      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .shell {
      box-sizing: border-box;
      width: 72px;
      height: 72px;
      flex: 0 0 auto;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shell img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }
    .shell img.is-speaking {
      animation: speak-nudge 1.1s ease-in-out infinite;
    }
    @keyframes speak-nudge {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.06) rotate(-2deg); }
      50% { transform: scale(1.04) rotate(1deg); }
      75% { transform: scale(1.07) rotate(-1deg); }
    }
    body.is-compact .shell img.is-speaking {
      animation: none;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="welcome-cluster" id="welcomeCluster">
      <div class="bubble">
        <div class="bubble-row">
          <p class="bubble-text">快来和我对话吧</p>
          <div class="wave" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>
    <div class="shell" id="shell">
      <img id="ball-img" alt="" draggable="false" class="is-speaking" />
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const icon = params.get('icon');
    const img = document.getElementById('ball-img');
    const shell = document.getElementById('shell');
    const stage = document.getElementById('stage');
    const welcomeCluster = document.getElementById('welcomeCluster');
    if (icon) img.src = icon;

    const WELCOME_MS = 6800;
    const FADE_MS = 400;

    window.setTimeout(() => {
      if (!welcomeCluster || !window.rdkFloatingBall?.welcomeDismissed) return;
      welcomeCluster.classList.add('is-hidden');
      window.setTimeout(() => {
        document.body.classList.add('is-compact');
        window.rdkFloatingBall.welcomeDismissed();
      }, FADE_MS);
    }, WELCOME_MS);

    const MOVE_THRESH_PX = 5;

    let abortActiveDrag = null;

    /**
     * 拖动策略（避免透明小窗 + pointer capture 在 Windows 上不稳定）：
     * 左键按下即通知主进程 dragStart，用全局光标轮询移动窗口；不依赖 renderer 在指针移出窗体后仍能收到 pointermove。
     * mouseup 时 dragEnd，若全程位移小于阈值则视为单击打开主窗口。
     */
    stage.addEventListener('mousedown', (e) => {
      if (e.button === 2) return;
      if (e.button !== 0 || !window.rdkFloatingBall) return;
      e.preventDefault();

      if (typeof abortActiveDrag === 'function') {
        abortActiveDrag();
        abortActiveDrag = null;
      }

      const startX = e.screenX;
      const startY = e.screenY;
      let mainDragStarted = false;

      const startMainDrag = () => {
        if (mainDragStarted) return;
        if (!window.rdkFloatingBall.dragStart) return;
        mainDragStarted = true;
        window.rdkFloatingBall.dragStart();
      };

      startMainDrag();

      const cleanup = (withClickIfTap, mouseUpEv) => {
        document.removeEventListener('mouseup', onMouseUp, true);
        window.removeEventListener('blur', onBlur, true);
        if (mainDragStarted && window.rdkFloatingBall.dragEnd) {
          window.rdkFloatingBall.dragEnd();
        }
        mainDragStarted = false;
        if (withClickIfTap && mouseUpEv) {
          const dist = Math.hypot(mouseUpEv.screenX - startX, mouseUpEv.screenY - startY);
          if (dist <= MOVE_THRESH_PX) {
            window.rdkFloatingBall.notifyClick();
          }
        }
      };

      const onMouseUp = (ev) => {
        if (ev.button !== 0) return;
        abortActiveDrag = null;
        cleanup(true, ev);
      };

      const onBlur = () => {
        abortActiveDrag = null;
        cleanup(false, null);
      };

      abortActiveDrag = () => {
        cleanup(false, null);
      };

      document.addEventListener('mouseup', onMouseUp, true);
      window.addEventListener('blur', onBlur, true);
    });

    stage.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (window.rdkFloatingBall?.showContextMenu) {
        window.rdkFloatingBall.showContextMenu(e.clientX, e.clientY);
      }
    });
  </script>
</body>
</html>
